---
# NNCP for Dell PowerEdge R640
#
# Uses identifier: pci-address so interface names don't matter.
# The "name" field is just a profile label, not the kernel interface name.
#
# Find the PCI address on a sample node:
#   ethtool -i eno1 | grep bus-info
#   # bus-info: 0000:18:00.0
apiVersion: nmstate.io/v1
kind: NodeNetworkConfigurationPolicy
metadata:
  name: ovs-bridge-dell-r640
spec:
  nodeSelector:
    feature.node.kubernetes.io/nic-profile: dell-r640
  desiredState:
    interfaces:
      # Define the uplink port by PCI address
      - name: uplink0
        type: ethernet
        state: up
        identifier: pci-address
        pci-address: "0000:18:00.0"    # <-- replace with actual PCI addr from your R640

      # OVS bridge using the uplink
      - name: br-ex
        type: ovs-bridge
        state: up
        bridge:
          options:
            stp: false
          port:
            - name: uplink0
            - name: br-ex
    ovs-db:
      external_ids:
        ovn-bridge-mappings: "physnet:br-ex"
