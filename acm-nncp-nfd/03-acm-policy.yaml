---
# ACM Policy - Ensure NFD Operator is installed on managed clusters
apiVersion: policy.open-cluster-management.io/v1
kind: Policy
metadata:
  name: policy-nfd-operator
  namespace: open-cluster-management-policies
  annotations:
    policy.open-cluster-management.io/standards: NIST-CSF
    policy.open-cluster-management.io/categories: CM Configuration Management
    policy.open-cluster-management.io/controls: CM-2 Baseline Configuration
spec:
  remediationAction: enforce
  disabled: false
  policy-templates:
    - objectDefinition:
        apiVersion: policy.open-cluster-management.io/v1
        kind: ConfigurationPolicy
        metadata:
          name: nfd-operator-ns
        spec:
          remediationAction: enforce
          severity: medium
          object-templates:
            - complianceType: musthave
              objectDefinition:
                apiVersion: v1
                kind: Namespace
                metadata:
                  name: openshift-nfd

    - objectDefinition:
        apiVersion: policy.open-cluster-management.io/v1
        kind: ConfigurationPolicy
        metadata:
          name: nfd-operator-sub
        spec:
          remediationAction: enforce
          severity: medium
          object-templates:
            - complianceType: musthave
              objectDefinition:
                apiVersion: operators.coreos.com/v1alpha1
                kind: Subscription
                metadata:
                  name: nfd
                  namespace: openshift-nfd
                spec:
                  channel: stable
                  name: nfd
                  source: redhat-operators
                  sourceNamespace: openshift-marketplace

    - objectDefinition:
        apiVersion: policy.open-cluster-management.io/v1
        kind: ConfigurationPolicy
        metadata:
          name: nfd-instance
        spec:
          remediationAction: enforce
          severity: medium
          object-templates:
            - complianceType: musthave
              objectDefinition:
                apiVersion: nfd.openshift.io/v1
                kind: NodeFeatureDiscovery
                metadata:
                  name: nfd-instance
                  namespace: openshift-nfd
                spec:
                  operand:
                    image: registry.redhat.io/openshift4/ose-node-feature-discovery-rhel9:latest

---
# ACM Policy - Deploy NodeFeatureRules for server model detection
apiVersion: policy.open-cluster-management.io/v1
kind: Policy
metadata:
  name: policy-nfd-nic-profile-rules
  namespace: open-cluster-management-policies
  annotations:
    policy.open-cluster-management.io/standards: NIST-CSF
    policy.open-cluster-management.io/categories: CM Configuration Management
    policy.open-cluster-management.io/controls: CM-2 Baseline Configuration
spec:
  remediationAction: enforce
  disabled: false
  dependencies:
    - apiVersion: policy.open-cluster-management.io/v1
      kind: Policy
      name: policy-nfd-operator
      namespace: open-cluster-management-policies
      compliance: Compliant
  policy-templates:
    - objectDefinition:
        apiVersion: policy.open-cluster-management.io/v1
        kind: ConfigurationPolicy
        metadata:
          name: nfd-nic-profile-rules
        spec:
          remediationAction: enforce
          severity: medium
          object-templates:
            - complianceType: musthave
              objectDefinition:
                apiVersion: nfd.k8s-sigs.io/v1alpha1
                kind: NodeFeatureRule
                metadata:
                  name: nic-profile-dell-r640
                spec:
                  rules:
                    - name: "dell-poweredge-r640"
                      labels:
                        "nic-profile": "dell-r640"
                      matchFeatures:
                        - feature: system.dmiid
                          matchExpressions:
                            sys_vendor: {op: In, value: ["Dell Inc."]}
                            product_name: {op: InRegexp, value: ["^PowerEdge R640$"]}

            - complianceType: musthave
              objectDefinition:
                apiVersion: nfd.k8s-sigs.io/v1alpha1
                kind: NodeFeatureRule
                metadata:
                  name: nic-profile-dell-r650
                spec:
                  rules:
                    - name: "dell-poweredge-r650"
                      labels:
                        "nic-profile": "dell-r650"
                      matchFeatures:
                        - feature: system.dmiid
                          matchExpressions:
                            sys_vendor: {op: In, value: ["Dell Inc."]}
                            product_name: {op: InRegexp, value: ["^PowerEdge R650.*"]}

            - complianceType: musthave
              objectDefinition:
                apiVersion: nfd.k8s-sigs.io/v1alpha1
                kind: NodeFeatureRule
                metadata:
                  name: nic-profile-hpe-dl380-gen10
                spec:
                  rules:
                    - name: "hpe-dl380-gen10"
                      labels:
                        "nic-profile": "hpe-dl380-gen10"
                      matchFeatures:
                        - feature: system.dmiid
                          matchExpressions:
                            sys_vendor: {op: In, value: ["HPE"]}
                            product_name: {op: InRegexp, value: ["ProLiant DL380 Gen10.*"]}

---
# ACM Policy - Deploy NNCPs per server model using PCI address matching
apiVersion: policy.open-cluster-management.io/v1
kind: Policy
metadata:
  name: policy-ovs-bridge-nncp
  namespace: open-cluster-management-policies
  annotations:
    policy.open-cluster-management.io/standards: NIST-CSF
    policy.open-cluster-management.io/categories: CM Configuration Management
    policy.open-cluster-management.io/controls: CM-2 Baseline Configuration
spec:
  remediationAction: enforce
  disabled: false
  dependencies:
    - apiVersion: policy.open-cluster-management.io/v1
      kind: Policy
      name: policy-nfd-nic-profile-rules
      namespace: open-cluster-management-policies
      compliance: Compliant
  policy-templates:
    # Dell R640
    - objectDefinition:
        apiVersion: policy.open-cluster-management.io/v1
        kind: ConfigurationPolicy
        metadata:
          name: nncp-ovs-bridge-dell-r640
        spec:
          remediationAction: enforce
          severity: medium
          object-templates:
            - complianceType: musthave
              objectDefinition:
                apiVersion: nmstate.io/v1
                kind: NodeNetworkConfigurationPolicy
                metadata:
                  name: ovs-bridge-dell-r640
                spec:
                  nodeSelector:
                    feature.node.kubernetes.io/nic-profile: dell-r640
                  desiredState:
                    interfaces:
                      - name: uplink0
                        type: ethernet
                        state: up
                        identifier: pci-address
                        pci-address: "0000:18:00.0"  # <-- replace
                      - name: br-ex
                        type: ovs-bridge
                        state: up
                        bridge:
                          options:
                            stp: false
                          port:
                            - name: uplink0
                            - name: br-ex
                    ovs-db:
                      external_ids:
                        ovn-bridge-mappings: "physnet:br-ex"

    # Dell R650
    - objectDefinition:
        apiVersion: policy.open-cluster-management.io/v1
        kind: ConfigurationPolicy
        metadata:
          name: nncp-ovs-bridge-dell-r650
        spec:
          remediationAction: enforce
          severity: medium
          object-templates:
            - complianceType: musthave
              objectDefinition:
                apiVersion: nmstate.io/v1
                kind: NodeNetworkConfigurationPolicy
                metadata:
                  name: ovs-bridge-dell-r650
                spec:
                  nodeSelector:
                    feature.node.kubernetes.io/nic-profile: dell-r650
                  desiredState:
                    interfaces:
                      - name: uplink0
                        type: ethernet
                        state: up
                        identifier: pci-address
                        pci-address: "0000:4b:00.0"  # <-- replace
                      - name: br-ex
                        type: ovs-bridge
                        state: up
                        bridge:
                          options:
                            stp: false
                          port:
                            - name: uplink0
                            - name: br-ex
                    ovs-db:
                      external_ids:
                        ovn-bridge-mappings: "physnet:br-ex"

    # HPE DL380 Gen10
    - objectDefinition:
        apiVersion: policy.open-cluster-management.io/v1
        kind: ConfigurationPolicy
        metadata:
          name: nncp-ovs-bridge-hpe-dl380-gen10
        spec:
          remediationAction: enforce
          severity: medium
          object-templates:
            - complianceType: musthave
              objectDefinition:
                apiVersion: nmstate.io/v1
                kind: NodeNetworkConfigurationPolicy
                metadata:
                  name: ovs-bridge-hpe-dl380-gen10
                spec:
                  nodeSelector:
                    feature.node.kubernetes.io/nic-profile: hpe-dl380-gen10
                  desiredState:
                    interfaces:
                      - name: uplink0
                        type: ethernet
                        state: up
                        identifier: pci-address
                        pci-address: "0000:03:00.0"  # <-- replace
                      - name: br-ex
                        type: ovs-bridge
                        state: up
                        bridge:
                          options:
                            stp: false
                          port:
                            - name: uplink0
                            - name: br-ex
                    ovs-db:
                      external_ids:
                        ovn-bridge-mappings: "physnet:br-ex"

---
# ACM PlacementRule - Target all managed clusters (adjust as needed)
apiVersion: apps.open-cluster-management.io/v1
kind: PlacementRule
metadata:
  name: placement-ovs-bridge
  namespace: open-cluster-management-policies
spec:
  clusterConditions:
    - status: "True"
      type: ManagedClusterConditionAvailable
  # Add clusterSelector to target specific clusters:
  # clusterSelector:
  #   matchLabels:
  #     environment: production

---
# Bind all three policies to the placement
apiVersion: policy.open-cluster-management.io/v1
kind: PlacementBinding
metadata:
  name: binding-ovs-bridge
  namespace: open-cluster-management-policies
placementRef:
  name: placement-ovs-bridge
  kind: PlacementRule
  apiGroup: apps.open-cluster-management.io
subjects:
  - name: policy-nfd-operator
    kind: Policy
    apiGroup: policy.open-cluster-management.io
  - name: policy-nfd-nic-profile-rules
    kind: Policy
    apiGroup: policy.open-cluster-management.io
  - name: policy-ovs-bridge-nncp
    kind: Policy
    apiGroup: policy.open-cluster-management.io
