---
# NNCP for Dell PowerEdge R650
apiVersion: nmstate.io/v1
kind: NodeNetworkConfigurationPolicy
metadata:
  name: ovs-bridge-dell-r650
spec:
  nodeSelector:
    feature.node.kubernetes.io/nic-profile: dell-r650
  desiredState:
    interfaces:
      - name: uplink0
        type: ethernet
        state: up
        identifier: pci-address
        pci-address: "0000:4b:00.0"    # <-- replace with actual PCI addr from your R650

      - name: br-ex
        type: ovs-bridge
        state: up
        bridge:
          options:
            stp: false
          port:
            - name: uplink0
            - name: br-ex
    ovs-db:
      external_ids:
        ovn-bridge-mappings: "physnet:br-ex"
